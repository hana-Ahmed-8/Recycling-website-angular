<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-lg border border-gray-100">

      <!-- Card Header -->
      <div class="text-center py-6 border-b border-gray-100">
        <h3 class="text-2xl font-extrabold text-teal-600 mb-2 select-none">Login</h3>
      </div>

      <!-- Card Body -->
      <div class="p-6">
        <form [formGroup]="loginForm" (ngSubmit)="submitLoginData()" class="space-y-5">

          <!-- Email Field -->
          <div>
            <label for="email" class="block text-gray-700 font-medium mb-1">Email</label>
            <input
              id="email"
              type="email"
              placeholder="Enter your email"
              formControlName="email"
              class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-teal-600 focus:ring-1 focus:ring-teal-500 outline-none transition"
              [class.border-red-500]="emailCtrl.invalid && emailCtrl.dirty"
            />

            <div *ngIf="emailCtrl.dirty && emailCtrl.invalid" class="text-red-500 text-sm mt-1">
              <div *ngIf="emailCtrl.errors?.['required']">Email is required</div>
              <div *ngIf="emailCtrl.errors?.['email']">Please enter a valid email</div>
            </div>
          </div>

          <div>
            <label for="password" class="block text-gray-700 font-medium mb-1">Password</label>
            <div class="relative">
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                placeholder="Enter your password"
                formControlName="password"
                class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-teal-600 focus:ring-1 focus:ring-teal-500 outline-none transition pr-10"
                [class.border-red-500]="passwordCtrl.invalid && passwordCtrl.dirty"
              />

              <!-- Eye Icon Button -->
              <button
                type="button"
                (click)="togglePassword()"
                class="absolute inset-y-0 right-2 flex items-center px-2 text-teal-600 hover:text-teal-700 focus:outline-none"
              >
                <ng-container *ngIf="!showPassword">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                    <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                    <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                  </svg>
                </ng-container>
                <ng-container *ngIf="showPassword">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-eye-slash" viewBox="0 0 16 16">
                    <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/>
                    <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/>
                    <path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/>
                  </svg>
                </ng-container>
              </button>
            </div>

  <div *ngIf="passwordCtrl.dirty && passwordCtrl.invalid" class="text-red-500 text-sm mt-1">
    <div *ngIf="passwordCtrl.errors?.['required']">Password is required</div>
    <div *ngIf="passwordCtrl.errors?.['minlength']">Password must be 8 characters minimum</div>
    <div *ngIf="passwordCtrl.errors?.['pattern']">Include uppercase, lowercase, number & special character</div>
  </div>
</div>


          <!-- Forgot Password -->
      <div class="text-right">
        <a class="text-teal-700 hover:text-teal-800 font-medium cursor-pointer">
          Forgot your password?
        </a>
      </div>

      <!-- Separator -->
      <div class="flex items-center gap-2">
        <span class="flex-grow h-px bg-gray-300"></span>
        <span class="text-gray-500 text-sm">OR</span>
        <span class="flex-grow h-px bg-gray-300"></span>
      </div>

      <!-- Google Button -->

      <button
        class="w-full bg-white border border-gray-300 hover:bg-gray-50 flex items-center justify-center gap-3 py-2.5 rounded-lg font-medium shadow-sm transition"
      >
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" />
        Sign in with Google
      </button>

      <!-- Sign Up -->
      <p class="text-center text-gray-600 font-medium">
        Don't have an account?
        <a class="text-teal-700 hover:text-teal-800 font-semibold cursor-pointer">
          Sign up
        </a>
      </p>

        </form>
      </div>

    </div>
  </div>
</div>
